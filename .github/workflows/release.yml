name: Release APK

on:
  push:
    tags: ['v*', '[0-9]*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本标签，例如 v1.0.0'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.commit.outputs.sha }}
      complete: ${{ steps.existing.outputs.complete }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and version
        id: version
        run: |
          python3 tools/release.py validate --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Pin source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Inspect release attachments
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/github_release.py inspect --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
      - name: Report existing public artifacts
        if: steps.existing.outputs.complete == 'true'
        run: echo 'The published APK and checksum already exist. They were kept unchanged.' >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          names = {'KEYSTORE_BASE64': 'ANDROID_KEYSTORE_BASE64', 'STORE_PASSWORD': 'ANDROID_STORE_PASSWORD',
                   'KEY_ALIAS': 'ANDROID_KEY_ALIAS', 'KEY_PASSWORD': 'ANDROID_KEY_PASSWORD'}
          missing = [name for variable, name in names.items() if not os.environ.get(variable, '').strip()]
          if missing:
              raise SystemExit('Missing repository signing Secrets: ' + ', '.join(missing) + '. See docs/releasing.md.')
          PY
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('KEYSTORE_BASE64', '')
          if not value.strip():
              raise SystemExit('Missing secret: ANDROID_KEYSTORE_BASE64')
          key = Path(os.environ['RUNNER_TEMP']) / 'qinglan-release.jks'
          key.write_bytes(base64.b64decode(''.join(value.split()), validate=True))
          key.chmod(0o600)
          PY
      - name: Build signed APK and run checks
        env:
          QINGLAN_REQUIRE_SIGNING: 'true'
          QINGLAN_STORE_FILE: ${{ runner.temp }}/qinglan-release.jks
          QINGLAN_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          QINGLAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QINGLAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 tools/localization.py
          python3 -m unittest discover -s tools/tests -v
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Verify and package APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          python3 tools/release.py package --tag "$RELEASE_TAG" --apk app/build/outputs/apk/release/app-release.apk
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports and obfuscation mapping
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/qinglan-release.jks"

  attach:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: release
      - name: Attach APK and checksum to the release
        run: |
          python3 tools/github_release.py attach --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --files release
          printf 'Release attachments: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
